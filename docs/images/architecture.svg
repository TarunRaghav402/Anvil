<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" role="img" aria-label="Anvil System Architecture Diagram">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#858585" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#007acc" />
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ec9b0" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="540" fill="#1e1e1e" />
  <rect x="0.5" y="0.5" width="1099" height="539" fill="none" stroke="#3c3c3c" />

  <!-- Header -->
  <rect x="0" y="0" width="1100" height="44" fill="#252526" />
  <line x1="0" y1="44" x2="1100" y2="44" stroke="#3c3c3c" />
  <text x="28" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">
    Anvil Architecture
  </text>
  <text x="190" y="28" fill="#858585" font-family="Consolas, Menlo, monospace" font-size="12">
    Browser Clients  ->  Express + Socket.io + Yjs Backend  ->  Firebase Auth / SQL Connect / Storage + GitHub
  </text>

  <!-- Column 1: Browser Clients -->
  <rect x="28" y="72" width="270" height="432" fill="#252526" stroke="#3c3c3c" stroke-width="1.5" />
  <rect x="28" y="72" width="270" height="4" fill="#007acc" />
  <text x="46" y="102" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Collaborator Browsers</text>
  <text x="46" y="122" fill="#9cdcfe" font-family="Consolas, Menlo, monospace" font-size="11">React + TypeScript + Vite</text>

  <rect x="46" y="142" width="234" height="68" fill="#1e1e1e" stroke="#3c3c3c" />
  <text x="58" y="166" fill="#cccccc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Monaco Editor + y-monaco</text>
  <text x="58" y="186" fill="#858585" font-family="system-ui, sans-serif" font-size="11">Multi-cursor CRDT sync &amp; comments</text>

  <rect x="46" y="226" width="234" height="68" fill="#1e1e1e" stroke="#3c3c3c" />
  <text x="58" y="250" fill="#cccccc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Sandboxed Live Preview</text>
  <text x="58" y="270" fill="#858585" font-family="system-ui, sans-serif" font-size="11">Isolated iframe + auto hot-reload</text>

  <rect x="46" y="310" width="234" height="68" fill="#1e1e1e" stroke="#3c3c3c" />
  <text x="58" y="334" fill="#cccccc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Firebase Web Client SDK</text>
  <text x="58" y="354" fill="#858585" font-family="system-ui, sans-serif" font-size="11">Email/password auth &amp; ID tokens</text>

  <rect x="46" y="394" width="234" height="88" fill="#1e1e1e" stroke="#3c3c3c" />
  <text x="58" y="418" fill="#cccccc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Explorer, Assets &amp; Git UI</text>
  <text x="58" y="438" fill="#858585" font-family="system-ui, sans-serif" font-size="11">Drag-drop sprites/audio, .zip export</text>
  <text x="58" y="456" fill="#ce9178" font-family="system-ui, sans-serif" font-size="11">Runtime-only PAT input (never stored)</text>

  <!-- Column 2: Node Backend -->
  <rect x="410" y="72" width="290" height="432" fill="#252526" stroke="#3c3c3c" stroke-width="1.5" />
  <rect x="410" y="72" width="290" height="4" fill="#4ec9b0" />
  <text x="428" y="102" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Anvil Backend (Node.js)</text>
  <text x="428" y="122" fill="#4ec9b0" font-family="Consolas, Menlo, monospace" font-size="11">Express + Socket.io + ws</text>

  <rect x="428" y="142" width="254" height="72" fill="#1e1e1e" stroke="#3c3c3c" />
  <text x="440" y="166" fill="#cccccc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Yjs Collaboration Server</text>
  <text x="440" y="186" fill="#858585" font-family="system-ui, sans-serif" font-size="11">In-memory Y.Doc rooms (/yjs/*)</text>
  <text x="440" y="202" fill="#858585" font-family="system-ui, sans-serif" font-size="11">Debounced flush to SQL (2s)</text>

  <rect x="428" y="228" width="254" height="76" fill="#1e1e1e" stroke="#3c3c3c" />
  <text x="440" y="252" fill="#cccccc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Auth &amp; Session Manager</text>
  <text x="440" y="272" fill="#858585" font-family="system-ui, sans-serif" font-size="11">Email-verified JWT + Socket.io presence</text>
  <text x="440" y="288" fill="#858585" font-family="system-ui, sans-serif" font-size="11">6-char session codes &amp; 30s grace timer</text>

  <rect x="428" y="318" width="254" height="76" fill="#1e1e1e" stroke="#3c3c3c" />
  <text x="440" y="342" fill="#cccccc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Preview &amp; Export Router</text>
  <text x="440" y="362" fill="#858585" font-family="system-ui, sans-serif" font-size="11">HMAC capability tokens (/api/preview)</text>
  <text x="440" y="378" fill="#858585" font-family="system-ui, sans-serif" font-size="11">Archiver streaming .zip exports</text>

  <rect x="428" y="408" width="254" height="74" fill="#1e1e1e" stroke="#3c3c3c" />
  <text x="440" y="432" fill="#cccccc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Sandboxed GitService</text>
  <text x="440" y="452" fill="#858585" font-family="system-ui, sans-serif" font-size="11">Temp OS folder materialization</text>
  <text x="440" y="468" fill="#858585" font-family="system-ui, sans-serif" font-size="11">PAT scrubbing + non-force push</text>

  <!-- Column 3: Firebase & GitHub -->
  <rect x="804" y="72" width="268" height="92" fill="#252526" stroke="#3c3c3c" stroke-width="1.5" />
  <rect x="804" y="72" width="268" height="4" fill="#dcdcaa" />
  <text x="822" y="102" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Firebase Auth</text>
  <text x="822" y="124" fill="#858585" font-family="system-ui, sans-serif" font-size="11">User identity, email verification</text>
  <text x="822" y="142" fill="#858585" font-family="system-ui, sans-serif" font-size="11">Emulator :9099 / Cloud Auth</text>

  <rect x="804" y="182" width="268" height="106" fill="#252526" stroke="#3c3c3c" stroke-width="1.5" />
  <rect x="804" y="182" width="268" height="4" fill="#c586c0" />
  <text x="822" y="212" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Firebase SQL Connect</text>
  <text x="822" y="232" fill="#9cdcfe" font-family="Consolas, Menlo, monospace" font-size="11">Data Connect / PostgreSQL</text>
  <text x="822" y="252" fill="#858585" font-family="system-ui, sans-serif" font-size="11">users, projects, project_nodes,</text>
  <text x="822" y="268" fill="#858585" font-family="system-ui, sans-serif" font-size="11">sessions, members, comments</text>

  <rect x="804" y="306" width="268" height="90" fill="#252526" stroke="#3c3c3c" stroke-width="1.5" />
  <rect x="804" y="306" width="268" height="4" fill="#ce9178" />
  <text x="822" y="336" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Firebase Storage</text>
  <text x="822" y="356" fill="#858585" font-family="system-ui, sans-serif" font-size="11">Binary sprites, audio, fonts</text>
  <text x="822" y="374" fill="#858585" font-family="system-ui, sans-serif" font-size="11">Backend-mediated (rules deny direct)</text>

  <rect x="804" y="414" width="268" height="90" fill="#252526" stroke="#3c3c3c" stroke-width="1.5" />
  <rect x="804" y="414" width="268" height="4" fill="#569cd6" />
  <text x="822" y="444" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">GitHub Repository</text>
  <text x="822" y="464" fill="#858585" font-family="system-ui, sans-serif" font-size="11">HTTPS remote push on demand</text>
  <text x="822" y="482" fill="#858585" font-family="system-ui, sans-serif" font-size="11">Cross-OS .gitattributes included</text>

  <!-- Connectors Browser -> Backend -->
  <line x1="298" y1="176" x2="410" y2="176" stroke="#4ec9b0" stroke-width="2" marker-end="url(#arrowTeal)" />
  <text x="354" y="167" text-anchor="middle" fill="#4ec9b0" font-family="Consolas, Menlo, monospace" font-size="10">WS /yjs</text>

  <line x1="298" y1="260" x2="410" y2="354" stroke="#007acc" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="352" y="294" text-anchor="middle" fill="#9cdcfe" font-family="Consolas, Menlo, monospace" font-size="10">/api/preview</text>

  <line x1="298" y1="436" x2="410" y2="270" stroke="#858585" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="350" y="395" text-anchor="middle" fill="#cccccc" font-family="Consolas, Menlo, monospace" font-size="10">REST + IO</text>

  <!-- Browser -> Firebase Auth -->
  <path d="M 298 344 L 352 344 L 352 56 L 938 56 L 938 72" fill="none" stroke="#dcdcaa" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)" />
  <text x="640" y="51" text-anchor="middle" fill="#dcdcaa" font-family="Consolas, Menlo, monospace" font-size="10">Firebase Client Auth (JWT ID Token)</text>

  <!-- Backend -> Firebase & GitHub -->
  <line x1="700" y1="176" x2="804" y2="232" stroke="#858585" stroke-width="2" marker-end="url(#arrow)" />
  <text x="752" y="190" text-anchor="middle" fill="#cccccc" font-family="Consolas, Menlo, monospace" font-size="10">GraphQL</text>

  <line x1="700" y1="260" x2="804" y2="118" stroke="#858585" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="752" y="148" text-anchor="middle" fill="#cccccc" font-family="Consolas, Menlo, monospace" font-size="10">Verify</text>

  <line x1="700" y1="354" x2="804" y2="354" stroke="#858585" stroke-width="2" marker-end="url(#arrow)" />
  <text x="752" y="344" text-anchor="middle" fill="#cccccc" font-family="Consolas, Menlo, monospace" font-size="10">Admin SDK</text>

  <line x1="700" y1="454" x2="804" y2="454" stroke="#007acc" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="752" y="444" text-anchor="middle" fill="#9cdcfe" font-family="Consolas, Menlo, monospace" font-size="10">HTTPS+PAT</text>
</svg>
